<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KiAct · Bilan Flash Durabilité</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F5F5F3;color:#1a1a1a;min-height:100vh}
#app{max-width:740px;margin:0 auto;padding:2rem 1.5rem 4rem}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid #E0DDD8}
.brand{font-size:12px;font-weight:700;color:#2A5C68;letter-spacing:.1em;text-transform:uppercase}
.badge{font-size:12px;color:#666;background:#fff;border:1px solid #E0DDD8;border-radius:20px;padding:4px 12px}
h1{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:6px}
h2{font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.sub{font-size:14px;color:#666;margin-bottom:1.5rem;line-height:1.5}
.stepinfo{font-size:12px;color:#999;margin-bottom:4px}
.card{background:#fff;border:1px solid #E0DDD8;border-radius:10px;padding:20px 22px;margin-bottom:12px}
.qlabel{font-size:11px;font-weight:700;color:#2A5C68;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
.qtext{font-size:14px;color:#1a1a1a;font-style:italic;line-height:1.65;margin-bottom:14px;border-left:3px solid #2A5C68;padding-left:12px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid #E0DDD8;border-radius:7px;cursor:pointer;margin-bottom:7px;background:#fff;transition:all .1s}
.opt:hover{border-color:#2A5C68;background:#EEF7F5}
.opt.sel{border-color:#2A5C68;background:#E1F0EE}
.optbox{width:17px;height:17px;border:2px solid #C0BDB8;background:#fff;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.optbox.round{border-radius:50%}
.optbox.sq{border-radius:3px}
.opt.sel .optbox{border-color:#2A5C68;background:#2A5C68}
.opttext{font-size:13px;color:#1a1a1a;line-height:1.4}
.cascade{margin-top:12px;padding:14px 16px;background:#F5F5F3;border-radius:7px;border-left:3px solid #3DAA44}
.cascade .qlabel{color:#3DAA44}
.hint{font-size:11px;color:#2A5C68;background:#EEF7F5;border-radius:5px;padding:5px 9px;margin-bottom:9px}
textarea{width:100%;border:1px solid #E0DDD8;border-radius:7px;padding:10px;font-size:13px;font-family:Arial,sans-serif;color:#1a1a1a;background:#FAFAF8;resize:vertical;min-height:75px;line-height:1.55}
textarea:focus{outline:none;border-color:#2A5C68}
input[type=text]{width:100%;border:1px solid #E0DDD8;border-radius:7px;padding:9px 12px;font-size:13px;font-family:Arial,sans-serif;color:#1a1a1a;background:#fff}
input[type=text]:focus{outline:none;border-color:#2A5C68}
select{width:100%;border:1px solid #E0DDD8;border-radius:7px;padding:9px 12px;font-size:13px;font-family:Arial,sans-serif;color:#1a1a1a;background:#fff}
select:focus{outline:none;border-color:#2A5C68}
.field{margin-bottom:14px}
.flabel{font-size:12px;font-weight:600;color:#555;margin-bottom:5px}
.btn{display:inline-flex;align-items:center;padding:10px 20px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:Arial,sans-serif;transition:all .1s}
.btnp{background:#2A5C68;color:#fff}
.btnp:hover{background:#214b56}
.btng{background:#fff;color:#666;border:1px solid #E0DDD8}
.btng:hover{background:#F5F5F3}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid #E0DDD8}
.coitem{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border:1px solid #E0DDD8;border-radius:9px;background:#fff;cursor:pointer;margin-bottom:9px;transition:all .1s}
.coitem:hover{border-color:#2A5C68;background:#EEF7F5}
.coname{font-size:14px;font-weight:700;color:#1a1a1a}
.cometa{font-size:11px;color:#999;margin-top:2px}
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:2px}
.empty{text-align:center;padding:3rem 1rem;color:#999;font-size:13px}
.transbox{background:#EEF7F5;border:1px solid #B8D8D4;border-radius:7px;padding:11px 14px;font-size:13px;color:#2A5C68;margin-bottom:1rem;line-height:1.55}
table.hm{width:100%;border-collapse:collapse;font-size:12px}
table.hm th{font-size:10px;font-weight:600;color:#999;text-align:center;padding:7px 3px}
table.hm td{padding:6px 3px}
.hmlabel{font-size:12px;font-weight:600;color:#1a1a1a;padding-right:12px;white-space:nowrap}
.hmcell{width:30px;height:30px;border-radius:5px;margin:0 auto;display:flex;align-items:center;justify-content:center;border:1px solid #E0DDD8;background:#F5F5F3;font-size:12px}
.hmcell.act{border:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.legitem{display:flex;align-items:center;gap:6px;font-size:11px;color:#666}
.legdot{width:11px;height:11px;border-radius:2px;flex-shrink:0}
.divider{height:1px;background:#E0DDD8;margin:20px 0}
.thhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.thtitle{font-size:11px;font-weight:700;color:#2A5C68;text-transform:uppercase;letter-spacing:.06em}
.levtag{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700}
.ansrow{font-size:12px;color:#1a1a1a;padding:5px 8px;background:#F5F5F3;border-radius:5px;border-left:2px solid #E0DDD8;margin-bottom:3px}
.anscasc{font-size:11px;color:#666;padding:4px 8px 4px 16px;border-left:2px solid #3DAA44;margin-bottom:3px}
.opt{position:relative}
.optscore{margin-left:auto;font-size:10px;font-weight:700;color:#2A5C68;background:#EEF7F5;border-radius:10px;padding:2px 8px;flex-shrink:0;align-self:center}
.clearans{font-size:11px;color:#999;text-decoration:underline;cursor:pointer;margin:2px 0 4px;display:inline-block}
.hmval{font-size:12px;font-weight:700;color:#1a1a1a;white-space:nowrap;padding-left:10px}
.legnote{font-size:11px;color:#999;margin-top:8px}
.ansscore{font-size:10px;color:#2A5C68;font-weight:700;margin-left:6px}
.corr{margin-top:10px;padding-top:10px;border-top:1px dashed #E0DDD8}
.corrline{display:flex;align-items:center;gap:10px;font-size:12px;color:#555;margin-bottom:6px}
.ovsel{width:auto;padding:5px 8px;font-size:12px}
.modtag{margin-left:8px;font-size:9px;font-weight:700;color:#388D54;background:#EAF3DE;border-radius:10px;padding:2px 7px;letter-spacing:.03em;text-transform:none}
@media (max-width:600px){#app{padding:1rem 12px 3rem}.card{padding:14px 12px}.hmlabel{white-space:normal;font-size:11px;padding-right:6px}.hmcell{width:20px;height:20px}table.hm th{font-size:8px;padding:4px 1px}table.hm td{padding:4px 1px}.hmval{font-size:10px;padding-left:4px}.topbar{flex-wrap:wrap;gap:8px}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="brand">KiAct &middot; Bilan Flash Durabilité</span><button class="btn btng" id="btn-liste" style="display:none;padding:4px 12px;font-size:12px;" onclick="backToList()">&larr; Liste des entreprises</button>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="autosave-indicator" style="font-size:11px;color:#999;display:none;">Sauvegarde auto...</span>
      <span class="badge" id="badge" style="display:none"></span>
    </div>
  </div>
  <div id="root"></div>
</div>
<script>
// KiAct · Outil d'entretien du Bilan Flash Durabilité
// Version du 29 octobre 2026. Les identifiants des questions (c1, col1, etc.) et le format
// des données enregistrées sont inchangés, pour que les entretiens existants restent lisibles.
// scores : un score par option (1 à 4). null = option exclue du calcul.

var THEMES = [
  {id:"clients",label:"Clients & marché",questions:[
    {id:"c1",label:"Q1. Pression externe",exp:"Pression externe des clients",
     text:"Certains de vos clients ou donneurs d’ordre vous ont-ils posé des questions sur vos pratiques environnementales ou sociales ces derniers temps?",type:"single",
     options:["Oui, c’est devenu fréquent","Oui, quelques fois, mais c’est encore rare","Pas encore, mais je m’attends à ce que cela vienne","Non, pas dans mon secteur"],
     scores:[null,null,null,null],
     cascade:{trigger:[0,1],label:"Comment avez-vous répondu?",type:"single",scores:[4,2,1,1],options:["Nous avions les éléments et nous avons répondu","Nous avons répondu, mais de façon approximative","Nous n’avons pas su répondre correctement","Nous avons perdu un contrat à cause de cela"]}},
    {id:"c2",label:"Q2. Réputation et différenciation",exp:"Réputation et différenciation",
     text:"Lorsqu’un prospect hésite entre vous et un concurrent, vos engagements ou vos valeurs jouent-ils un rôle?",type:"single",
     options:["Oui, c’est un élément différenciateur reconnu","Peut-être, mais nous ne le mesurons pas","Non, ce sont surtout le prix et la qualité technique","Je ne sais pas, nous ne posons pas la question aux prospects"],
     scores:[4,3,2,1],
     cascade:{trigger:[0,1],label:"Le mettez-vous en avant dans votre communication?",type:"single",options:["Oui, clairement et de façon structurée","Un peu, de manière informelle","Non, nous ne savons pas comment le formuler","Non, nous préférons ne pas en faire un argument commercial"]}},
    {id:"c4",label:"Q3. Préparation aux demandes des clients",exp:"Préparation à un questionnaire RSE",
     text:"Si un client important vous demandait demain de remplir un questionnaire RSE détaillé pour rester dans sa chaîne de fournisseurs, seriez-vous prêts?",type:"single",
     options:["Oui, nous avons déjà les éléments structurés","Partiellement, nous aurions besoin de formaliser","Non, nous serions en difficulté","Ce scénario n’est pas réaliste pour notre secteur"],
     scores:[4,3,1,null],
     cascade:{trigger:[1,2],label:"Qu’est-ce qui vous manque le plus? (plusieurs réponses)",type:"multi",options:["Les données (chiffres, indicateurs)","Une politique formalisée","Du temps pour s’en occuper","Nous ne savons pas par où commencer"]}}
  ]},
  {id:"collab",label:"Collaborateurs",questions:[
    {id:"col1",label:"Q1. Tension sur le recrutement",exp:"Tension sur le recrutement",
     text:"Avez-vous des difficultés à recruter ou à garder certains profils en ce moment? Au-delà du salaire, que cherchent vos candidates et candidats?",type:"single",
     options:["Oui, c’est un problème récurrent et préoccupant","Oui, sur certains profils","Non, mais je sens que cela pourrait changer","Non, pas de difficulté particulière"],
     scores:[1,2,3,3],
     cascade:{trigger:[0,1],label:"Que cherchent-ils au-delà du salaire? (plusieurs réponses)",type:"multi",options:["De la flexibilité et un bon équilibre entre vie professionnelle et vie privée","Du sens, comprendre pourquoi l’entreprise existe","Des perspectives d’évolution et de formation","Je ne sais pas vraiment ce qu’ils cherchent"]}},
    {id:"col2",label:"Q2. Engagement interne",exp:"Engagement interne",
     text:"Vos collaboratrices et collaborateurs savent-ils pourquoi l’entreprise existe, au-delà du chiffre d’affaires? Cette raison d’être est-elle partagée?",type:"single",
     options:["Oui, c’est clair et partagé, nous en parlons régulièrement","Oui, mais c’est implicite et jamais formalisé","Pas vraiment, chacun fait son travail","Non, et cela me préoccupe"],
     scores:[4,3,2,1],
     cascade:{trigger:[1,2],label:"Souhaitez-vous changer cela?",type:"single",options:["Oui, mais je ne sais pas comment m’y prendre","Oui, c’est dans mes priorités cette année","Pas forcément, cela fonctionne ainsi","Je n’y avais pas vraiment réfléchi avant aujourd’hui"]}},
    {id:"col3",label:"Q3. Dépendance aux personnes clés",exp:"Dépendance aux personnes clés",
     text:"Si 2 ou 3 personnes clés partaient demain, chez un concurrent ou dans une entreprise plus proche de leurs valeurs, qu’est-ce que cela changerait pour vous?",type:"single",
     options:["Ce serait critique, nous avons des dépendances fortes","Ce serait difficile, mais nous nous en remettrions","Nous l’avons anticipé, les compétences sont partagées","Je n’y ai pas pensé"],
     scores:[1,2,4,1],
     cascade:{trigger:[0,1],label:"Qu’est-ce qui les retiendrait selon vous? (2 au maximum)",type:"multi",options:["Une meilleure rémunération","Plus de sens et d’impact dans leur travail","Plus de flexibilité et d’autonomie","Des perspectives de développement et d’évolution de carrière","Je ne sais pas vraiment ce qui les motive"]}},
    {id:"col4",label:"Q4. Conditions de travail formalisées",exp:"Conditions de travail formalisées",
     text:"Avez-vous formalisé ce que vous offrez à votre personnel au-delà du contrat de travail (flexibilité, formation, bien-être, équité)?",type:"single",
     options:["Oui, nous avons des politiques écrites et connues de toutes et tous","Partiellement, certains points sont formalisés","Non, c’est au cas par cas selon les personnes","Non, mais nous devrions le faire"],
     scores:[4,3,2,2],
     cascade:{trigger:[1,2],label:"Qu’offrez-vous déjà sans l’avoir formalisé? (plusieurs réponses)",type:"multi",options:["De la flexibilité horaire ou du télétravail","Des formations ou du développement professionnel","Des avantages sociaux informels","Peu de choses pour le moment"]}},
    {id:"col5",label:"Q5. Santé et sécurité",exp:"Santé et sécurité au travail",
     text:"La santé et la sécurité au travail sont-elles pilotées de façon structurée?",type:"single",
     options:["Système de santé et sécurité documenté, avec indicateurs et suivi","Séances et suivi réguliers, peu formalisés","Nous réagissons aux incidents, sans prévention","Au cas par cas, sans suivi particulier"],
     scores:[4,3,2,1]}
  ]},
  {id:"conso",label:"Consommation & production",questions:[
    {id:"co1",label:"Q1. Suivi des coûts",exp:"Suivi des coûts d’exploitation",
     text:"Savez-vous ce que vous dépensez en énergie, en déplacements et en consommables? Ces postes ont-ils évolué ces dernières années?",type:"single",
     options:["Oui, nous suivons ces postes de près et nous avons des données","Nous en avons une idée globale, sans suivi précis","Non, nous ne les mesurons pas","Ces postes sont négligeables dans notre activité"],
     scores:[4,3,2,null],
     cascade:{trigger:[0,1],label:"Cette évolution a-t-elle influencé vos décisions?",type:"single",options:["Oui, nous avons déjà pris des mesures de réduction","Nous y pensons, sans avoir encore agi","Non, aucune décision n’a encore été prise"]}},
    {id:"co2",label:"Q2. Dépendance aux ressources",exp:"Dépendance aux ressources",
     text:"Dépendez-vous fortement de ressources (matières, énergie, prestataires logistiques) dont le coût ou la disponibilité pourrait devenir un problème?",type:"single",
     options:["Oui, clairement, c’est un risque que nous avons identifié","Probablement, mais nous n’avons pas formalisé ce risque","Non, nous avons diversifié nos sources","Non, notre activité ne crée pas ce type de dépendance"],
     scores:[2,1,3,null],
     cascade:{trigger:[0,1],label:"Qu’est-ce qui vous rend le plus vulnérable? (plusieurs réponses)",type:"multi",options:["Un fournisseur ou un prestataire unique","La hausse des prix de l’énergie","Des matières premières rares ou importées","Des délais de livraison imprévisibles","La réglementation sur certains produits ou matériaux"]}},
    {id:"co4",label:"Q3. Actions de réduction",exp:"Actions de réduction existantes",
     text:"Avez-vous déjà pris des mesures pour réduire votre consommation ou vos déchets, même petites ou informelles?",type:"single",
     options:["Oui, nous avons des actions structurées et suivies","Oui, quelques initiatives non formalisées","Nous y réfléchissons, sans avoir encore agi","Non, ce n’est pas encore une priorité","Notre activité produit très peu de déchets, la question ne s’applique pas"],
     scores:[4,3,2,1,null],
     cascade:{trigger:[0,1],label:"Sur quoi portent principalement ces actions? (plusieurs réponses)",type:"multi",options:["La réduction de la consommation d’énergie","La gestion et le tri des déchets","La réduction des déplacements professionnels","Le choix de fournisseurs locaux ou responsables","La réduction du papier et du numérique"]}},
    {id:"co5",label:"Q4. Mobilité et déplacements",exp:"Mobilité et déplacements",
     text:"Mesurez-vous l’impact de vos déplacements professionnels et de vos véhicules?",type:"single",
     options:["Oui, suivi régulier et plan de réduction en place","Quelques données collectées, non consolidées","Nous en avons conscience, sans mesure","Non, nous ne l’avons jamais regardé"],
     scores:[4,3,2,1]}
  ]},
  {id:"fourn",label:"Fournisseurs & partenaires",questions:[
    {id:"f1",label:"Q1. Dépendance aux fournisseurs",exp:"Dépendance aux fournisseurs",
     text:"Dépendez-vous fortement de certains fournisseurs ou sous-traitants (source unique, prestataire clé)? Que se passerait-il si l’un d’eux disparaissait ou augmentait brutalement ses prix?",type:"single",
     options:["Oui, nous avons des dépendances fortes et nous en sommes conscients","Oui, mais nous pensons que le risque est faible","Non, nous avons plusieurs sources pour nos besoins principaux","Non, notre activité ne crée pas ce type de dépendance"],
     scores:[2,2,3,null],
     cascade:{trigger:[0,1],label:"Qu’est-ce qui crée cette dépendance? (plusieurs réponses)",type:"multi",options:["Un fournisseur unique pour un produit ou un service clé","Une relation ancienne, difficile à remettre en question","Peu d’alternatives sur le marché","Un coût de changement trop élevé","Une dépendance géographique ou logistique"]}},
    {id:"f2",label:"Q2. Connaissance de la chaîne d’approvisionnement",exp:"Connaissance de la chaîne d’approvisionnement",
     text:"Connaissez-vous les pratiques de vos principaux fournisseurs et prestataires, y compris vos logiciels et plateformes? Pour les grands éditeurs, avez-vous défini des critères sociaux ou environnementaux dans vos choix?",type:"single",
     options:["Oui, nous avons une bonne visibilité et nous la vérifions","Partiellement, nous connaissons certains fournisseurs","Non, nous ne leur avons jamais posé la question","Nos principaux fournisseurs sont de grands groupes, nous n’avons pas de levier direct","La question ne s’applique pas, nos achats sont négligeables"],
     scores:[4,3,1,2,null],
     cascade:{trigger:[1,2,3],label:"Qu’est-ce qui vous retient ou vous limite? (plusieurs réponses)",type:"multi",options:["Nous ne savons pas comment aborder le sujet","Nous craignons de fragiliser la relation commerciale","Nous manquons de temps et de ressources","Ce sont de grands groupes, sans levier direct","Nous pourrions agir sur les critères de sélection des nouveaux fournisseurs","Nous n’y avions pas pensé avant aujourd’hui"]}},
    {id:"f4",label:"Q3. Dépendance géographique",exp:"Dépendance géographique",
     text:"Dépendez-vous de fournisseurs situés hors de Suisse ou d’Europe? Comment gérez-vous ce risque?",type:"single",
     options:["Oui, c’est un risque que nous avons clairement identifié","Oui, mais sans plan de repli formalisé","Non, nos fournisseurs sont principalement suisses ou européens","Non, notre activité ne crée pas ce type de dépendance"],
     scores:[2,2,3,null],
     cascade:{trigger:[0,1],label:"Comment gérez-vous ce risque actuellement? (plusieurs réponses)",type:"multi",options:["Nous avons des stocks de sécurité","Nous avons identifié des fournisseurs de remplacement","Nous relocalisons certains achats","Nous n’avons pas encore de plan concret","Nous surveillons la situation, sans action formelle"]}}
  ]},
  {id:"gouv",label:"Gouvernance",questions:[
    {id:"g1",label:"Q1. Prise de décision",exp:"Prise de décision",
     text:"Lorsque vous prenez une décision importante (investissement, recrutement, nouveau marché), qui est impliqué? Avez-vous des instances formelles, ou est-ce plutôt informel?",type:"single",
     options:["Nous avons des instances formelles (comité, conseil, processus défini)","C’est semi-formel, quelques personnes clés sont consultées","C’est informel, je décide principalement seul ou seule","Cela dépend du type de décision"],
     scores:[4,3,2,2],
     cascade:{trigger:[1,2],label:"Cela vous pose-t-il parfois problème?",type:"single",options:["Oui, nous avons déjà pris des décisions que nous avons regrettées","Parfois, notamment pour les décisions stratégiques","Non, cela fonctionne bien pour notre taille","Je n’y avais pas réfléchi sous cet angle"]}},
    {id:"g2",label:"Q2. Valeurs dans les décisions",exp:"Valeurs dans les décisions",
     text:"Vous est-il arrivé de refuser un client, un contrat ou un partenariat contraire à vos valeurs? Ou, à l’inverse, d’accepter quelque chose qui vous a mis mal à l’aise?",type:"single",
     options:["Oui, j’ai déjà refusé, et je l’assume clairement","Oui, j’ai déjà accepté quelque chose qui m’a mis mal à l’aise","Les deux me sont arrivés","Non, je n’ai pas encore eu à faire ce choix"],
     scores:[3,2,2,2],
     cascade:{trigger:[0,1,2],label:"Vos valeurs sont-elles formalisées quelque part?",type:"single",options:["Oui, elles sont écrites et connues de toutes et tous","Elles existent, mais ne sont pas formalisées","Non, elles sont dans ma tête, mais nulle part ailleurs","Non, et je voudrais le faire"]}},
    {id:"g3",label:"Q3. Transparence interne",exp:"Transparence interne",
     text:"Votre personnel sait-il comment les décisions importantes sont prises? Dispose-t-il d’un espace pour s’exprimer?",type:"single",
     options:["Oui, le processus est transparent et partagé","Partiellement, certaines décisions sont expliquées, d’autres non","Non, les décisions sont communiquées sans explication","Je ne sais pas vraiment comment il le perçoit"],
     scores:[4,3,1,2],
     cascade:{trigger:[1,2],label:"Qu’est-ce qui vous retient de partager davantage? (plusieurs réponses)",type:"multi",options:["La crainte de créer des attentes que nous ne pourrons pas tenir","Certaines décisions sont sensibles sur le plan commercial","Nous manquons de temps et de structure","Nous ne savons pas comment nous y prendre","Je n’y avais pas pensé comme un enjeu important"]}},
    {id:"g4",label:"Q4. Continuité",exp:"Continuité sans la direction",
     text:"Si vous deviez vous absenter demain (maladie, imprévu), l’entreprise saurait-elle continuer? Vos décisions clés sont-elles documentées?",type:"single",
     options:["Oui, nous avons un plan de continuité formalisé","Partiellement, certains points sont documentés","Non, beaucoup repose sur moi personnellement","Je n’ai jamais vraiment formalisé cela"],
     scores:[4,3,2,1],
     cascade:{trigger:[1,2,3],label:"Qu’est-ce qui repose uniquement sur vous aujourd’hui? (plusieurs réponses)",type:"multi",options:["Les relations avec les clients clés","Les décisions financières et contractuelles","La vision et la stratégie de l’entreprise","Les connaissances techniques ou métier","La culture et les valeurs de l’entreprise"]}}
  ]},

    if(!sec)return;

    if(sec==="Services sur site (sécurité, nettoyage)")l=(company.siteType==="Nettoyage")?["p1","p2n","ss3","sn1","sn2","sn3"]:["p1","p2","ss3"];

// ---------- Scores ----------
// Le niveau correspond à la partie entière du score : 2,67 reste « Conscient » tant que 3 n'est pas atteint.
function levelOf(s){if(s===null||s===undefined||isNaN(s))return null;return Math.max(1,Math.min(4,Math.floor(s+1e-9)));}
function fmt(s){if(s===null||s===undefined||isNaN(s))return "-";var r=Math.round(s*100)/100;return (r%1===0?String(r):r.toFixed(2).replace(/0$/,"")).replace(".",",");}
function optScore(q,i){if(!q.scores)return null;var v=q.scores[i];return (v===undefined)?null:v;}
// Score effectif d'une question : celui de l'option choisie ; si l'option est exclue et que la
// sous-question porte un score (cas de c1), on compte la sous-réponse.
function cascScore(q,a){
  if(!q.cascade||!q.cascade.scores||a.cascade===undefined||a.cascade===null||Array.isArray(a.cascade))return null;
  if(q.cascade.trigger.indexOf(a.main)<0)return null;
  var v=q.cascade.scores[a.cascade];return (v===undefined)?null:v;
}
function qScore(q,a){
  if(!a||a.main===undefined||a.main===null||Array.isArray(a.main))return {s:null,src:null};
  var s=optScore(q,a.main);if(s!==null)return {s:s,src:"main"};
  var cs=cascScore(q,a);if(cs!==null)return {s:cs,src:"casc"};
  return {s:null,src:null};
}
function retained(c,tid){
  var o=c.overrides&&c.overrides[tid];
  if(o&&o.score!==""&&o.score!==null&&o.score!==undefined)return Number(o.score);
  var s=c.scores?c.scores[tid]:null;return (s===undefined)?null:s;
}

  if(typeof inner==="string")e.innerHTML=inner;else if(inner)e.appendChild(inner);

}

function toggleOpt(qId,oi,isMulti){
  if(!cur.answers[qId])cur.answers[qId]={};

  else{a.cascade=oi;}

}

// Calcul : moyenne des scores des réponses comptées. Les réponses exclues et les sous-réponses ne comptent pas.
// Aucun arrondi. Une dimension sans réponse comptée n'a pas de score.
function computeScores(answers,company){
  var res={};
  THEMES.forEach(function(t){
    var total=0,count=0;
    activeQuestions(t,{company:company}).forEach(function(q){
      var r=qScore(q,answers[q.id]);
      if(r.s===null)return;
      total+=r.s;count++;
    });
    res[t.id]=count?total/count:null;
  });
  return res;
}
function computeAndSynth(){cur.scores=computeScores(cur.answers||{},cur.company);autoSave();screen="synthesis";render();}

function entryOf(c){return {company:c.company,opening:c.opening,answers:c.answers,scores:c.scores,overrides:c.overrides||{},finalNotes:c.finalNotes||"",savedAt:new Date().toLocaleDateString("fr-CH")};}
function missingJustifications(c){
  var m=[];THEMES.forEach(function(t){var o=c.overrides&&c.overrides[t.id];if(o&&o.score!==""&&o.score!==undefined&&!(o.just||"").trim())m.push(t.label);});return m;
}
function saveEntry(){
  readNotes();
  var m=missingJustifications(cur);
  if(m.length&&!confirm("Justification manquante pour : "+m.join(", ")+".\n\nOK : sauvegarder quand même.\nAnnuler : compléter d’abord."))return;
  var entry=entryOf(cur);
  if(cur.editIndex>=0)companies[cur.editIndex]=entry;else companies.unshift(entry);
  saveStorage();clearDraft();screen="home";cur=null;render();
}

  if(cur){
    readNotes();

    var unchanged=false;
    if(cur.editIndex>=0&&companies[cur.editIndex]){
      var o=companies[cur.editIndex];
      unchanged=JSON.stringify([o.company,o.opening,o.answers,o.scores,o.overrides||{},o.finalNotes||""])===JSON.stringify([cur.company,cur.opening,cur.answers,cur.scores,cur.overrides||{},cur.finalNotes||""]);
    }
    if(screen==="cadrage"){
      var n=document.getElementById("c-name");if(n&&n.value.trim()){cur.company.name=n.value.trim();var d=document.getElementById("c-date");if(d)cur.company.date=d.value.trim();}
    }
    if(unchanged||!(cur.company&&cur.company.name))clearDraft();else autoSave();
  }
  goHome();
}

// ---------- Fichiers ----------
function downloadJSON(obj,filename){
  var blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function slugName(n){return (n||"Sans_nom").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"Sans_nom";}
function exportData(){
  if(!companies.length){alert("Aucune donnée à exporter.");return;}
  downloadJSON(companies,"KiAct_BilansFlash_tous_"+new Date().toISOString().slice(0,10)+".json");
}
function exportOne(entry){
  if(!entry||!entry.company){alert("Aucune entreprise à exporter.");return;}
  var pack={format:"kiact-bilan-flash",version:2,exportedAt:new Date().toISOString(),entreprises:[JSON.parse(JSON.stringify(entry))]};
  downloadJSON(pack,"KiAct_BilanFlash_"+slugName(entry.company.name)+"_"+new Date().toISOString().slice(0,10)+".json");
}
function sameCompany(a,b){
  var n1=((a.company||{}).name||"").trim().toLowerCase(),n2=((b.company||{}).name||"").trim().toLowerCase();
  var d1=((a.company||{}).date||"").trim(),d2=((b.company||{}).date||"").trim();
  return n1!==""&&n1===n2&&d1===d2;
}
function importData(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result),list;
      if(Array.isArray(data))list=data;
      else if(data&&Array.isArray(data.entreprises))list=data.entreprises;
      else if(data&&data.company)list=[data];
      else{alert("Fichier invalide, aucune entreprise trouvée.");return;}
      list=list.filter(function(x){return x&&x.company;});
      if(!list.length){alert("Fichier invalide, aucune entreprise trouvée.");return;}
      var added=0,replaced=0,skipped=0;
      list.forEach(function(entry){
        var idx=-1;for(var i=0;i<companies.length;i++){if(sameCompany(companies[i],entry)){idx=i;break;}}
        if(idx>-1){
          var nm=(entry.company.name||"Sans nom")+(entry.company.date?" ("+entry.company.date+")":"");
          if(confirm(nm+" existe déjà.\n\nOK : remplacer par la version du fichier.\nAnnuler : garder la version actuelle.")){companies[idx]=entry;replaced++;}else skipped++;
        }else{companies.unshift(entry);added++;}
      });
      saveStorage();render();
      alert("Import terminé.\n"+added+" entreprise(s) ajoutée(s), "+replaced+" remplacée(s), "+skipped+" conservée(s) sans changement.\nLes autres entreprises n’ont pas été modifiées.");
    }catch(err){alert("Erreur de lecture du fichier JSON.");}
    e.target.value="";
  };
  reader.readAsText(file);
}

// ---------- Brouillon ----------
function autoSave(){
  if(!cur)return;
  try{
    var draft={company:cur.company,opening:cur.opening,answers:cur.answers,scores:cur.scores,overrides:cur.overrides||{},finalNotes:cur.finalNotes||"",themeIndex:cur.themeIndex||0,editIndex:cur.editIndex,screen:screen,isDraft:true};
    localStorage.setItem("kiact_draft",JSON.stringify(draft));
    var ind=document.getElementById("autosave-indicator");
    if(ind){ind.style.display="inline";ind.textContent="Sauvegarde automatique";setTimeout(function(){ind.style.display="none";},1500);}
  }catch(e){}
}
function loadDraft(){try{var d=localStorage.getItem("kiact_draft");if(d){var draft=JSON.parse(d);if(draft.isDraft)return draft;}}catch(e){}return null;}
function clearDraft(){try{localStorage.removeItem("kiact_draft");}catch(e){}}

// ---------- Export pour le rapport ----------
// Structure inchangée : === PROFIL ===, === NOTES OUVERTURE ===, === REPONSES PAR THEMATIQUE ===, === SCORES DE RESILIENCE ===.
function buildExportText(c){
  var L=[],ans=c.answers||{},tool=c.scores||{};
  var line=function(tid){var s=retained(c,tid),lv=levelOf(s);return lv?fmt(s)+"/4 ("+SC[lv].lv+")":"non évalué (aucune réponse comptée)";};
  L.push("=== PROFIL ===");
  L.push("Nom: "+(c.company.name||""));
  if(c.company.date)L.push("Date de l’entretien: "+c.company.date);
  L.push("Secteur: "+(c.company.sector||""));
  if(c.company.siteType&&c.company.sector==="Services sur site (sécurité, nettoyage)")L.push("Type de service: "+c.company.siteType);
  if(c.company.sector2)L.push("Second profil: "+c.company.sector2);
  L.push("Taille: "+(c.company.size||"")+" collaborateurs");
  L.push("Clients: "+(c.company.clients||""));
  if(c.company.context)L.push("Contexte: "+c.company.context);
  L.push("");
  L.push("=== NOTES OUVERTURE ===");
  var op=c.opening||{};
  if(op.q0)L.push("Contexte entreprise: "+op.q0);
  if(op.q1)L.push("Tensions actuelles: "+op.q1);
  if(op.q2)L.push("Vulnérabilités futures: "+op.q2);
  if(op.q3)L.push("Ce qui existe déjà: "+op.q3);
  L.push("");
  L.push("=== REPONSES PAR THEMATIQUE ===");
  THEMES.forEach(function(t){
    L.push("");
    L.push("-- "+t.label+" (Score: "+line(t.id)+") --");
    activeQuestions(t,c).forEach(function(q){
      var a=ans[q.id];if(!a)return;
      var mv=a.main;if(mv===undefined||mv===null)return;
      var txt=Array.isArray(mv)?mv.map(function(i){return q.options[i];}).join(", "):q.options[mv];
      var sc=Array.isArray(mv)?null:optScore(q,mv);
      L.push(q.exp+(q.module?" (module sectoriel, grille "+q.ref+")":"")+": "+txt+" ["+(sc===null?"exclu du calcul":"score "+sc)+"]");
      if(a.cascade!==undefined&&a.cascade!==null&&q.cascade){
        var cv=a.cascade;
        var ct=Array.isArray(cv)?cv.map(function(i){return q.cascade.options[i];}).join(", "):q.cascade.options[cv];
        var cs=cascScore(q,a);
        if(ct)L.push("  -> "+ct+(cs!==null?" [score "+cs+"]":""));
      }
    });
  });
  L.push("");
  L.push("=== SCORES DE RESILIENCE ===");
  THEMES.forEach(function(t){
    var o=c.overrides&&c.overrides[t.id];
    var s=line(t.id);
    if(o&&o.score!==""&&o.score!==undefined){
      var ts=tool[t.id];
      s+=" | score outil "+(ts===null||ts===undefined?"non évalué":fmt(ts)+"/4")+" | justification : "+((o.just||"").trim()||"non renseignée");
    }
    L.push(t.label+": "+s);
  });
  if(c.finalNotes){L.push("");L.push("=== NOTES CONSULTANT ===");L.push(c.finalNotes);}
  return L.join("\n");
}
function exportForRapport(){
  if(!cur)return;
  var m=missingJustifications(cur);
  var text=buildExportText(cur);
  var overlay=div("");overlay.id="export-overlay";
  overlay.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;";
  var modal=div("card");modal.style.cssText="max-width:640px;width:100%;max-height:85vh;overflow-y:auto;background:#fff;border-radius:12px;padding:24px;";
  var title=div("qlabel");title.textContent="Texte à copier dans Claude";modal.appendChild(title);
  var inst=div("sub");inst.style.cssText="font-size:13px;color:#666;margin-bottom:12px;line-height:1.5;";
  inst.innerHTML="1. Copiez tout le texte ci-dessous.<br>2. Ouvrez le projet « Bilan Flash RSE » dans Claude.<br>3. Collez le texte avec le transcript Noota et l’adresse du site de l’entreprise.";
  modal.appendChild(inst);
  if(m.length){var w=div("transbox");w.style.cssText="border-color:#EF9F27;background:#FAEEDA;color:#854F0B;";w.textContent="Justification manquante pour : "+m.join(", ")+".";modal.appendChild(w);}
  var ta=document.createElement("textarea");ta.value=text;
  ta.style.cssText="width:100%;height:260px;font-size:12px;font-family:monospace;border:1px solid #E0DDD8;border-radius:8px;padding:10px;background:#F5F5F3;resize:none;";
  modal.appendChild(ta);
  var row=div("");row.style.cssText="display:flex;gap:10px;margin-top:14px;";
  var bcopy=btn("btnp","Copier le texte",function(){
    ta.select();
    var done=function(){bcopy.textContent="Texte copié";setTimeout(function(){bcopy.textContent="Copier le texte";},2000);};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,function(){document.execCommand("copy");done();});}
    else{document.execCommand("copy");done();}
  });
  row.appendChild(bcopy);
  row.appendChild(btn("btng","Fermer",function(){document.body.removeChild(overlay);}));
  modal.appendChild(row);overlay.appendChild(modal);document.body.appendChild(overlay);ta.select();
}

// ---------- Démarrage ----------
loadStorage();
var draft0=loadDraft();
if(draft0){cur=draft0;if(!cur.overrides)cur.overrides={};screen=draft0.screen||"theme";}
render();

</script>
